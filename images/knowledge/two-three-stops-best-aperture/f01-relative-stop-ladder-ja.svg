<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" role="img" aria-labelledby="t"><title id="t">「開放から2〜3段」を、開放F値の違うレンズで絶対F値に直した図（はしご図）。各行は開放F値から始まり、2段絞る、3段絞るの順に絶対F値を示す。F1.2 → F2.4 → F3.4、F1.4 → F2.8 → F4、F2 → F4 → F5.6、F2.8 → F5.6 → F8、F4 → F8 → F11、F5.6 → F11 → F16。2段絞る・3段絞るの列は各行ごとに帯で囲まれ、上の行では F2.4〜F3.4、下の行では F11〜F16 と、同じ「2〜3段」が行ごとにまったく違う絶対F値になることを示す。F2.4・F3.4 は計算値。これは絞りの算数だけの図で、どの絞りが光学的に最良かは示していない。どの行・どの列も「良い」「悪い」としては描かない。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8c96aa"/></marker></defs>
<text x="20" y="40" font-size="30" fill="#eef1f8" text-anchor="start" font-weight="700">「開放から2〜3段」を、F値に直すと</text>
<text x="20" y="78" font-size="26" fill="#8c96aa" text-anchor="start" font-weight="600">絞りの算数だけの図です。</text>
<text x="20" y="114" font-size="26" fill="#8c96aa" text-anchor="start" font-weight="600">どの絞りが光学的に最良かは示していません。</text>
<text x="150" y="172" font-size="28" fill="#eef1f8" text-anchor="middle" font-weight="700">開放</text>
<text x="420" y="172" font-size="28" fill="#ffb14a" text-anchor="middle" font-weight="700">2段絞る</text>
<text x="660" y="172" font-size="28" fill="#ffb14a" text-anchor="middle" font-weight="700">3段絞る</text>
<line x1="40" y1="188" x2="760" y2="188" stroke="#2b3140" stroke-width="1.5"/>
<rect x="320" y="206" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="240" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F1.2</text>
<line x1="212" y1="228" x2="308" y2="228" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="240" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F2.4*</text>
<line x1="486" y1="228" x2="590" y2="228" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="240" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F3.4*</text>
<rect x="320" y="290" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="324" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F1.4</text>
<line x1="212" y1="312" x2="308" y2="312" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="324" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F2.8</text>
<line x1="486" y1="312" x2="590" y2="312" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="324" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F4</text>
<rect x="320" y="374" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="408" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F2</text>
<line x1="212" y1="396" x2="308" y2="396" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="408" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F4</text>
<line x1="486" y1="396" x2="590" y2="396" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="408" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F5.6</text>
<rect x="320" y="458" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="492" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F2.8</text>
<line x1="212" y1="480" x2="308" y2="480" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="492" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F5.6</text>
<line x1="486" y1="480" x2="590" y2="480" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="492" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F8</text>
<rect x="320" y="542" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="576" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F4</text>
<line x1="212" y1="564" x2="308" y2="564" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="576" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F8</text>
<line x1="486" y1="564" x2="590" y2="564" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="576" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F11</text>
<rect x="320" y="626" width="430" height="52" rx="26" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="150" y="660" font-size="36" fill="#eef1f8" text-anchor="middle" font-weight="700">F5.6</text>
<line x1="212" y1="648" x2="308" y2="648" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="660" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F11</text>
<line x1="486" y1="648" x2="590" y2="648" stroke="#8c96aa" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="660" y="660" font-size="36" fill="#ffb14a" text-anchor="middle" font-weight="700">F16</text>
<text x="20" y="724" font-size="26" fill="#8c96aa" text-anchor="start" font-weight="500">1段絞るとF値は約1.4倍。* は計算値（カメラの表示値ではありません）。</text>
</g>
</svg>
