<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" role="img" aria-labelledby="t"><title id="t">Calculated values: how large the same 30 µm (0.03 mm) blur on the sensor plane appears, in arcminutes, under different viewing conditions. Phone showing the whole image about 1.2 arcmin (with assumptions); A4, A3 and A2 from 50 cm about 1.7, 2.4 and 3.4 arcmin; the whole-image viewing convention (5×, 25 cm) about 2.06 arcmin; the 100% view (27-inch 4K, 50 cm) about 5.4–8.5 arcmin, typical range 4–15 arcmin; 20× at 25 cm about 8.25 arcmin. A geometric calculation, not a threshold for whether blur is visible.</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">Same 30 µm blur, different viewing conditions</text>
<text x="20.0" y="84.0" fill="#ffb14a" font-size="26" font-weight="500" text-anchor="start">Calculated angles (geometry). Not a threshold of visibility</text>
<line x1="400.0" y1="130.0" x2="400.0" y2="630.0" stroke="#2b3140" stroke-width="1.5"/>
<line x1="400.0" y1="630.0" x2="400.0" y2="638.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="400.0" y="670.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">0</text>
<line x1="484.4" y1="630.0" x2="484.4" y2="638.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="484.4" y="670.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">4</text>
<line x1="568.9" y1="630.0" x2="568.9" y2="638.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="568.9" y="670.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">8</text>
<line x1="653.3" y1="630.0" x2="653.3" y2="638.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="653.3" y="670.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">12</text>
<line x1="737.8" y1="630.0" x2="737.8" y2="638.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="737.8" y="670.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">16</text>
<text x="780.0" y="706.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="end">Apparent angle (arcmin)</text>
<line x1="442.2" y1="120.0" x2="442.2" y2="630.0" stroke="#ff8a00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="450.2" y="116.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">About 2 arcmin (convention)</text>
<text x="386.0" y="179.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="end">Phone, whole image (assumed)</text>
<line x1="400.0" y1="170.0" x2="425.3" y2="170.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
<text x="435.3" y="179.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">1.2</text>
<text x="386.0" y="239.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="end">A4 from 50 cm</text>
<line x1="400.0" y1="230.0" x2="435.9" y2="230.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
<text x="445.9" y="239.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">1.7</text>
<text x="386.0" y="299.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="end">Convention (5×, 25 cm)</text>
<line x1="400.0" y1="290.0" x2="443.5" y2="290.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
<text x="453.5" y="299.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">2.06</text>
<text x="386.0" y="359.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="end">A3 from 50 cm</text>
<line x1="400.0" y1="350.0" x2="450.9" y2="350.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
<text x="460.9" y="359.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">2.41</text>
<text x="386.0" y="419.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="end">A2 from 50 cm</text>
<line x1="400.0" y1="410.0" x2="471.8" y2="410.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
