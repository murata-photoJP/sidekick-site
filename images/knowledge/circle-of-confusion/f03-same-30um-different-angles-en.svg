<text x="386.0" y="479.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="end">100% view (27-inch 4K, 50 cm)</text>
<line x1="512.9" y1="470.0" x2="578.4" y2="470.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt" stroke-opacity="0.85"/>
<line x1="400.0" y1="470.0" x2="512.9" y2="470.0" stroke="#2b3140" stroke-width="2" stroke-dasharray="4 6"/>
<text x="588.4" y="479.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">5.35–8.45</text>
<text x="386.0" y="539.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="end">20×, 25 cm</text>
<line x1="400.0" y1="530.0" x2="574.2" y2="530.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt"/>
<text x="584.2" y="539.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">8.25</text>
<text x="386.0" y="599.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="end">100% view (typical range)</text>
<line x1="484.4" y1="590.0" x2="716.7" y2="590.0" stroke="#ffb14a" stroke-width="14" stroke-linecap="butt" stroke-opacity="0.85"/>
<line x1="400.0" y1="590.0" x2="484.4" y2="590.0" stroke="#2b3140" stroke-width="2" stroke-dasharray="4 6"/>
<text x="726.7" y="599.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">4–15</text>
</g>
