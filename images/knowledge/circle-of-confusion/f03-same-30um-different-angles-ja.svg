<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" role="img" aria-labelledby="t"><title id="t">計算値：同じ 30 µm（0.03 mm）のセンサー面のぼけが、見る条件によって何分角に見えるか。スマホ全体表示 約1.2分角（仮定付き）、A4・A3・A2 を 50 cm から 約1.7・2.4・3.4分角、全体鑑賞の規約（5倍・25 cm）約2.06分角、100% 表示（27インチ 4K・50 cm）約5.4〜8.5分角、代表範囲 4〜15分角、20倍・25 cm 約8.25分角。幾何学的な計算値であり、ぼけが見える／見えないの閾値ではない。</title>
