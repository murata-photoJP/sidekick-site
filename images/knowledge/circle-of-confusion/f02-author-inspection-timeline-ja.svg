<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-labelledby="t"><title id="t">本人の経験にもとづく図：ピント確認の条件の時系列——35mm MF ではレンズの被写界深度目盛、4×5（612/69/67）ではエボニー 3.5 倍ルーペで原版、D1/D1x ではモニター 100% 表示（雑誌付録の原寸データ）、K-1 の頃から現在は必要なところだけ 100%。そのあいだ許容錯乱円の値は 0.03 のまま変わらなかった。Research の数値や正誤の判定は含まない。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">本人の経験にもとづく図（AC-2026-005）</text>
<text x="20.0" y="84.0" fill="#eef1f8" font-size="30" font-weight="700" text-anchor="start">私のピント確認の条件は変わった</text>
<line x1="60.0" y1="120.0" x2="60.0" y2="540.0" stroke="#2b3140" stroke-width="3"/>
<circle cx="60.0" cy="150.0" r="10" fill="#ffb14a"/>
<text x="90.0" y="128.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">〜1990年ごろ</text>
<text x="90.0" y="162.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">35mm MF</text>
<text x="90.0" y="196.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">レンズの被写界深度目盛</text>
<circle cx="60.0" cy="270.0" r="10" fill="#ffb14a"/>
<text x="90.0" y="248.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">1995〜2000年ごろ</text>
<text x="90.0" y="282.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">4×5（612 / 69 / 67）</text>
<text x="90.0" y="316.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">3.5 倍ルーペで原版を見る</text>
<circle cx="60.0" cy="390.0" r="10" fill="#ffb14a"/>
<text x="90.0" y="368.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">2000年〜</text>
<text x="90.0" y="402.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">D1 / D1x</text>
<text x="90.0" y="436.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">モニターで 100% 表示</text>
<circle cx="60.0" cy="510.0" r="10" fill="#ffb14a"/>
<text x="90.0" y="488.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">K-1 の頃〜現在</text>
<text x="90.0" y="522.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">デジタル</text>
<text x="90.0" y="556.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">必要なところだけ 100%</text>
<rect x="560.0" y="110.0" width="220.0" height="440.0" rx="14" fill="none" stroke="#ff8a00" stroke-width="3"/>
<text x="670.0" y="170.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">許容錯乱円の値</text>
<text x="670.0" y="228.0" fill="#ff8a00" font-size="56" font-weight="700" text-anchor="middle">0.03</text>
<text x="670.0" y="280.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">変わらず</text>
<text x="670.0" y="490.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">（35mm も 4×5 も</text>
<text x="670.0" y="524.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">同じ値のまま）</text>
<line x1="20.0" y1="640.0" x2="780.0" y2="640.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="674.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">検査条件は三度変わったが、数字は一度も変わらなかった</text>
</g>
</svg>
