<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 944" width="800" height="944" role="img" aria-labelledby="t"><title id="t">概念図。左右に二つの縦の経路。左「私が通った経路（フィルム）」は、Velvia 6×9 / 6×12 で撮る（記憶）→ 現像に出す → 受け取る → スキャン（フラットベッド＋透過ユニット）→ ゴミ・傷を一つずつ取る、の五段。右「知人が通った経路（D1）」は、D1 で撮る（知人が、東京の街で）→ データを転送する、の二段。両方の経路は同じ太さの線で下の一つの箱「同じ A4 のカラーレーザーで出力（事務用、機種は不明）」につながる。注記：画質比較の実験図ではありません。当時、私が実際に通った二つの経路です。被写体も撮る人も違う（山のポジ／東京の街）。段の数と種類を示す図で、優劣の矢印ではない。本サイトの整理。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="42.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">当時、私が実際に通った二つの経路</text>
<text x="195.0" y="96.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">私が通った経路（フィルム）</text>
<text x="605.0" y="96.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">知人が通った経路（D1）</text>
<rect x="20.0" y="118.0" width="350.0" height="86.0" rx="12" fill="none" stroke="#2b3140" stroke-width="1.5"/>
<text x="195.0" y="152.0" fill="#eef1f8" font-size="28" font-weight="600" text-anchor="middle">Velvia 6×9 / 6×12 で撮る</text>
<text x="195.0" y="190.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">（記憶）</text>
<line x1="195.0" y1="204.0" x2="195.0" y2="222.0" stroke="#2b3140" stroke-width="2.0" stroke-linecap="round"/>
