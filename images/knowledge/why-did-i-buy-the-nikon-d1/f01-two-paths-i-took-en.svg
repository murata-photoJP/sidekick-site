<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 944" width="800" height="944" role="img" aria-labelledby="t"><title id="t">Conceptual map. Two vertical paths side by side. Left, "the path I took (film)": shot on Velvia 6×9 / 6×12 (from memory) -- sent for processing -- collected -- scanned (flatbed + transparency unit) -- dust and scratches removed one by one: five stages. Right, "an acquaintance's path (D1)": shot on the D1 (by an acquaintance, on the streets of Tokyo) -- files transferred: two stages. Both paths lead, with lines of the same weight, into one box at the bottom: "output on the same A4 color laser (office machine, model unknown)". Note: not an image-quality experiment; the two paths I actually took at the time. Different subjects, different photographers (a mountain transparency / Tokyo streets). The figure shows the number and kind of stages, not a ranking. This site's own drawing.</title>
