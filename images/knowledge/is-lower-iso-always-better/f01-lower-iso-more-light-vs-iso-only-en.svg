<circle cx="282.857" cy="492" r="9" fill="#ffb14a"/>
<circle cx="331.429" cy="492" r="9" fill="#ffb14a"/>
<text x="210" y="552" font-size="26" fill="#ff8a00" text-anchor="middle" font-weight="700">Light particles: 24 (more)</text>
<line x1="210" y1="564" x2="210" y2="568" stroke="#ffb14a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="574" width="340" height="110" rx="12" fill="none" stroke="#ff8a00" stroke-width="2.5"/>
<text x="210" y="603" font-size="28" fill="#ff8a00" text-anchor="middle" font-weight="700">The fluctuation</text>
<text x="210" y="639" font-size="26" fill="#8c96aa" text-anchor="middle" font-weight="500">of the light itself</text>
<text x="210" y="675" font-size="26" fill="#8c96aa" text-anchor="middle" font-weight="500">stands out less</text>
