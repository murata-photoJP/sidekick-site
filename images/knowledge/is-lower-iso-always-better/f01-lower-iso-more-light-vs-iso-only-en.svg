<circle cx="692" cy="484.5" r="9" fill="#8c96aa"/>
<text x="590" y="552" font-size="26" fill="#8c96aa" text-anchor="middle" font-weight="700">Light particles: 12 (same)</text>
<line x1="590" y1="564" x2="590" y2="568" stroke="#8c96aa" stroke-width="3" marker-end="url(#ah)"/>
<rect x="420" y="574" width="340" height="110" rx="12" fill="none" stroke="#2b3140" stroke-width="2.5"/>
<text x="590" y="603" font-size="24" fill="#eef1f8" text-anchor="middle" font-weight="700">No more light particles</text>
