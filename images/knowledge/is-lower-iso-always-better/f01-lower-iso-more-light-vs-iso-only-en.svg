<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-labelledby="t"><title id="t">Conceptual diagram (not a measurement): the two meanings of "lowering the ISO." The shared starting point is a dark scene. Left column: lower the ISO and lengthen the shutter → more light particles reach the sensor (more particles) → the light's fluctuation stands out less. Right column: lower only the ISO number (same aperture and shutter) → the same number of particles arrive → no more light particles; headroom on the bright side and the shadows depend on the design. The ISO number is not drawn as a ranking of image quality. No formulas, square roots or measured graphs.</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb14a"/></marker></defs>
<text x="20" y="40" font-size="26" fill="#8c96aa" text-anchor="start" font-weight="600">Conceptual diagram (not a measurement)</text>
<text x="20" y="84" font-size="30" fill="#eef1f8" text-anchor="start" font-weight="700">"Lowering the ISO" can mean two things</text>
<rect x="250" y="112" width="300" height="78" rx="12" fill="none" stroke="#8c96aa" stroke-width="2" stroke-dasharray="10 8"/>
<text x="400" y="146" font-size="28" fill="#eef1f8" text-anchor="middle" font-weight="700">Same dark scene</text>
<text x="400" y="176" font-size="26" fill="#8c96aa" text-anchor="middle" font-weight="500">Light particles: 12</text>
<line x1="310" y1="190" x2="210" y2="224" stroke="#ffb14a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="490" y1="190" x2="590" y2="224" stroke="#8c96aa" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="230" width="340" height="112" rx="12" fill="none" stroke="#ffb14a" stroke-width="2.5"/>
<text x="210" y="278" font-size="28" fill="#eef1f8" text-anchor="middle" font-weight="700">Lower the ISO +</text>
<text x="210" y="314" font-size="26" fill="#8c96aa" text-anchor="middle" font-weight="500">lengthen the shutter</text>
<line x1="210" y1="342" x2="210" y2="366" stroke="#ffb14a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="372" width="340" height="150" rx="12" fill="none" stroke="#2b3140" stroke-width="1.5" stroke-dasharray="6 6"/>
