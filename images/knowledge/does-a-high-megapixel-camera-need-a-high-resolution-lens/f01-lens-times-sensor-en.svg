<text x="400.0" y="946.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">Contrast left in the photograph = lens × sensor × …</text>
<text x="400.0" y="984.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="middle">Not megapixels multiplied: contrast at each fineness, multiplied.</text>
