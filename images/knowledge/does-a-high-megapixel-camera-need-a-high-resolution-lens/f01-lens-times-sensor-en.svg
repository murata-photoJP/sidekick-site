<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" width="800" height="1080" role="img" aria-labelledby="t"><title id="t">Conceptual figure in three parts. Top: the chain from scene through lens, sensor, processing and output to the viewed photograph, as five identical boxes. Middle: a schematic of how much contrast remains at each level of detail, coarse to fine. The lens curve falls gradually but never reaches zero; a coarse sensor's curve falls earlier, a fine sensor's later. Combining lens and sensor gives the contrast left in the photograph: the fine sensor's combination is never below the coarse one, the gap opens in the middle and narrows toward fine detail, and there is no vertical boundary line. The curves are not measurements and carry no numbers. Bottom: the idea that the photo simply gets the lower megapixel count of lens and sensor is struck out, and replaced by: contrast left in the photograph = lens x sensor x ..., not megapixels multiplied. This site's own drawing.</title>
