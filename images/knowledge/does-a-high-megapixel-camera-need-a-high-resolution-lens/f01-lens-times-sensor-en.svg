<text x="146.0" y="738.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">Contrast left in the photograph = lens × sensor</text>
<text x="20.0" y="784.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">A common idea (it does not hold)</text>
