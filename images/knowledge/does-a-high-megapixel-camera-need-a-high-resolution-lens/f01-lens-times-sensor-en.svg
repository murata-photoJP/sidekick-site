<text x="760.0" y="584.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="end">Fine detail</text>
<text x="20.0" y="622.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">Schematic. Not measurements. The curve shapes carry no numbers.</text>
