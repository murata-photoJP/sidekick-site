<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-labelledby="t"><title id="t">Conceptual map. Two vertical cross-sections side by side. Left, "the film era": lens -- (air) -- surface-side layers -- light-sensitive layers (vary by film stock) -- auxiliary layers -- base. Right, "the digital era": lens -- cover glass / IR-cut / low-pass filter stack -- microlens -- color filter -- pixel (photosensitive region) -- processing (RAW development, corrections). Both are drawn with the same line weight and the same box style, with no arrows, no rays and no numbers. Note: schematic; layer thicknesses and proportions are not to scale. Not a ranking; it shows only that the structure receiving the lens image changed. This site's own drawing.</title>
