<text x="400.0" y="450.6" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">Enlarge</text>
<line x1="654.0" y1="340.0" x2="654.0" y2="397.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="544.0" y="400.0" width="220.0" height="84.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="654.0" y="450.6" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">Scan</text>
<line x1="146.0" y1="487.0" x2="146.0" y2="508.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="400.0" y1="487.0" x2="400.0" y2="508.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="654.0" y1="487.0" x2="654.0" y2="508.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="146.0" y1="508.0" x2="654.0" y2="508.0" stroke="#ffb14a" stroke-width="2.5"/>
<text x="780.0" y="556.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="end">ppi: the cell count set here</text>
<text x="780.0" y="592.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="end">cell count ≠ recorded detail</text>
<line x1="316.0" y1="508.0" x2="316.0" y2="637.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="36.0" y="640.0" width="560.0" height="110.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="316.0" y="687.6" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">Output</text>
<text x="316.0" y="719.6" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">transparency · print · magazine · screen</text>
<line x1="599.0" y1="695.0" x2="637.0" y2="695.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="640.0" y="640.0" width="124.0" height="110.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="702.0" y="704.4" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">View</text>
<text x="316.0" y="790.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">What must be preserved depends on the use</text>
<line x1="20.0" y1="836.0" x2="780.0" y2="836.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="872.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">This site's own framework, not a diagram from the period</text>
</g>
