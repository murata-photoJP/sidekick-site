<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t"><title id="t">Conceptual diagram: from one and the same 4×5 transparency, four example uses branch off (viewing on a light table with a loupe / magazine and print / large print / archival scan), each with something different to preserve (local detail and texture / the look on the page / the look on the wall / future reuse), and the fineness of capture needed is not fixed but depends on conditions. No quantity is drawn. The four are examples, not an order, a ranking or the proportions of the period. No pixel count, ppi or resolving-power figures. This is the framework used in this site's investigation, not a diagram from the period.</title>
