<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t"><title id="t">概念図：同じ1枚の4×5ポジから、ライトボックスとルーペで見る／雑誌・印刷／大きなプリント／保存用スキャンという四つの用途例へ分かれ、それぞれ守りたいもの（局所の細部・質感／誌面での見え／壁で見たときの見え／将来の再利用）が違い、必要な取り込みの細かさは固定ではなく条件で決まる。量の大小は描いていない。四つは例であり、順序・優劣・当時の割合ではない。画素数・ppi・解像力の数値は含まない。本サイトの調査で置いた整理であり、当時の概念図ではない。</title>
