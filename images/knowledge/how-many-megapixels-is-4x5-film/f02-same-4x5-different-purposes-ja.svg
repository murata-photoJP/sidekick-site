<text x="694.0" y="630.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">固定ではない</text>
<line x1="20.0" y1="700.0" x2="780.0" y2="700.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="736.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">四つは用途の例。順序・優劣・当時の割合ではありません</text>
<text x="20.0" y="772.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">本サイトの調査で置いた整理（当時の概念図ではありません）</text>
</g>
