<line x1="624.0" y1="504.0" x2="764.0" y2="504.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="694.0" y="556.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">必要な細かさ</text>
