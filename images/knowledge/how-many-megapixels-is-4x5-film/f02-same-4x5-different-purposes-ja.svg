<text x="106.0" y="456.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">局所の細部・</text>
<text x="106.0" y="490.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">質感</text>
