<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 668" width="800" height="668" role="img" aria-labelledby="t"><title id="t">Conceptual side view. Left: a view camera with the lens tilted forward; to the right, a near flower, an intermediate valley and a distant mountain. One line rising from below the camera is the plane of sharp focus, passing through the near flower and the distant summit. On both sides of it a wedge-shaped band, widening with distance, is the zone of acceptable focus. The flower and the summit lie inside the band; the valley floor lies outside it. Parts outside the band may become soft; the figure does not say they must. Angles and distances are not actual values. This site's own drawing.</title>
