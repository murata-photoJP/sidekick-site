<text x="24.0" y="1068.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">位置が続けて動いた結果が、長時間露光では軌跡として記録される</text>
<text x="24.0" y="1122.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">星は光り続けている。でも、同じ画素を照らし続けてはいない。</text>
