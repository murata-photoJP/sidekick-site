<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150" role="img" aria-labelledby="t"><title id="t">模式図。空の星の光がレンズを通ってセンサー（受光素子）の上に幅のある星像として届き、固定撮影では地球の自転によってその星像がセンサーの画素の上を少しずつ動く。一つの画素に星の光が入るのは、星像がその画素を通過している間だけ。光の経路・星像の形や大きさ・移動量は模式化したもので実測値ではない。</title>
