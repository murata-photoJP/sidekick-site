<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t"><title id="t">模式図。同じ30分を一枚にする三つの方法（30分×1枚の長時間露光、30秒×60枚の平均、30秒×60枚の比較明）について、軌跡上の一つの画素が受けた星の光と空の光を棒で比べた図。長時間露光と平均は空が相対的に大きく、比較明は1コマ分の関係を保つ。理想化した模式図。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="24.0" y="40.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">模式図（理想化した線形モデル。実測ではありません）</text>
<text x="24.0" y="90.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">同じ30分を、一枚にする三つの方法</text>
<text x="24.0" y="124.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">軌跡の上の一つの画素が受けた光：星の光と、空の光</text>
<text x="24.0" y="186.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">A　30分 × 1枚の長時間露光</text>
<text x="40.0" y="228.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">星</text>
<rect x="90.0" y="204.0" width="120.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="224.0" y="228.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">通過した約30秒分</text>
<text x="40.0" y="276.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">空</text>
<rect x="90.0" y="252.0" width="480.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<line x1="556.0" y1="248.0" x2="584.0" y2="288.0" stroke="#eef1f8" stroke-width="3.0"/>
<line x1="568.0" y1="248.0" x2="596.0" y2="288.0" stroke="#eef1f8" stroke-width="3.0"/>
<text x="90.0" y="314.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">60コマ分（棒はここで省略）</text>
<text x="24.0" y="362.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">B　30秒 × 60枚を平均合成</text>
<text x="40.0" y="404.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">星</text>
<rect x="90.0" y="380.0" width="4.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="108.0" y="404.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">約30秒分 ÷ 60</text>
<text x="40.0" y="452.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">空</text>
<rect x="90.0" y="428.0" width="120.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<text x="224.0" y="452.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">1コマ分</text>
<text x="24.0" y="522.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">C　30秒 × 60枚を比較明合成</text>
<text x="40.0" y="564.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">星</text>
<rect x="90.0" y="540.0" width="108.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="212.0" y="564.0" fill="#ff8a00" font-size="26" font-weight="500" text-anchor="start">一番明るい1コマ分</text>
<text x="40.0" y="612.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">空</text>
<rect x="90.0" y="588.0" width="120.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<text x="224.0" y="612.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">1コマ分（＋ノイズの明るい側）</text>
<line x1="40.0" y1="662.0" x2="760.0" y2="662.0" stroke="#2b3140" stroke-width="1.6"/>
<text x="24.0" y="706.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">AとB：星も空も同じ比率で60分の1。軌跡と空の比は同じ。</text>
<text x="24.0" y="742.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">C：星も空も1コマ分のまま。</text>
<text x="24.0" y="778.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">棒の長さは模式値。ノイズ・飽和・現像などは含めていない。</text>
</g>
</svg>
