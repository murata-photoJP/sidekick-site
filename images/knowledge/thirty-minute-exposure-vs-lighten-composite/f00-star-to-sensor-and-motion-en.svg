<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150" role="img" aria-labelledby="t"><title id="t">Schematic. Light from a star passes through the lens and lands on the sensor (image sensor) as a star image of finite width; with a fixed camera the Earth's rotation moves that image little by little across the sensor's pixels. A pixel receives starlight only while the star image is passing over it. The light path, the star-image shape and size and the movement are schematic, not measured values.</title>
