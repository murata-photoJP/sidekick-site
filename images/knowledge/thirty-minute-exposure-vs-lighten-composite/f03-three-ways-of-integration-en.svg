<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t"><title id="t">Schematic. Three ways of turning the same 30 minutes into one image (one 30-minute exposure, sixty 30 s frames averaged, sixty 30 s frames Lighten-composited), comparing as bars the starlight and sky light received by one pixel on the trail. In the long exposure and the average the sky is relatively large; Lighten keeps the one-frame relationship. Idealized schematic.</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="24.0" y="40.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Schematic (idealized linear model, not measured)</text>
<text x="24.0" y="90.0" fill="#eef1f8" font-size="24" font-weight="700" text-anchor="start">Three ways of turning the same 30 minutes into one image</text>
<text x="24.0" y="124.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Light received by one pixel on the trail: starlight and sky light</text>
<text x="24.0" y="186.0" fill="#eef1f8" font-size="24" font-weight="700" text-anchor="start">A   One 30-minute exposure</text>
<text x="40.0" y="228.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">Star</text>
<rect x="90.0" y="204.0" width="120.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="224.0" y="228.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">about 30 s of the passage</text>
<text x="40.0" y="276.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Sky</text>
<rect x="90.0" y="252.0" width="480.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<line x1="556.0" y1="248.0" x2="584.0" y2="288.0" stroke="#eef1f8" stroke-width="3.0"/>
<line x1="568.0" y1="248.0" x2="596.0" y2="288.0" stroke="#eef1f8" stroke-width="3.0"/>
<text x="90.0" y="314.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">60 frames' worth (bar cut short here)</text>
<text x="24.0" y="362.0" fill="#eef1f8" font-size="24" font-weight="700" text-anchor="start">B   60 × 30 s frames, averaged</text>
<text x="40.0" y="404.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">Star</text>
<rect x="90.0" y="380.0" width="4.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="108.0" y="404.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">about 30 s worth ÷ 60</text>
<text x="40.0" y="452.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Sky</text>
<rect x="90.0" y="428.0" width="120.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<text x="224.0" y="452.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">1 frame's worth</text>
<text x="24.0" y="522.0" fill="#eef1f8" font-size="24" font-weight="700" text-anchor="start">C   60 × 30 s frames, Lighten</text>
<text x="40.0" y="564.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">Star</text>
<rect x="90.0" y="540.0" width="108.0" height="32.0" fill="#ffb14a" fill-opacity="0.95"/>
<text x="212.0" y="564.0" fill="#ff8a00" font-size="24" font-weight="500" text-anchor="start">brightest single frame's worth</text>
<text x="40.0" y="612.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Sky</text>
<rect x="90.0" y="588.0" width="120.0" height="32.0" fill="#2b3140" stroke="#8c96aa" stroke-width="0.8"/>
<text x="224.0" y="612.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">1 frame's worth (+ bright side of noise)</text>
<line x1="40.0" y1="662.0" x2="760.0" y2="662.0" stroke="#2b3140" stroke-width="1.6"/>
<text x="24.0" y="706.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">A and B: star and sky both ÷ 60 — same trail-to-sky ratio.</text>
<text x="24.0" y="742.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">C: star and sky both stay at one frame's worth.</text>
<text x="24.0" y="778.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Bars are illustrative; noise, saturation, development not included.</text>
</g>
</svg>
