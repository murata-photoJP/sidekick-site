<text x="192.2" y="254.1" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">Peak under this model condition</text>
<text x="192.2" y="284.1" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">(aberration improvement vs. diffraction penalty)</text>
<text x="335.2" y="185.2" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">A  Fraction retained after aberration</text>
