<text x="46.0" y="694.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">MODEL RESULT / Synthetic spherical-aberration model</text>
<text x="46.0" y="728.0" fill="#eef1f8" font-size="23" font-weight="500" text-anchor="start">Conditions: 2 waves of aberration, f/1.4-equivalent wide open, 550 nm</text>
<text x="46.0" y="762.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">Not a measurement of a real lens. T = A × D (product)</text>
