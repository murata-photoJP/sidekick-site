<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 830" width="800" height="830" role="img" aria-labelledby="t"><title id="t">Results of a synthetic spherical-aberration model (MODEL RESULT). The fraction retained after aberration (A) rises as you stop down; the diffraction limit (D) falls continuously from wide open as you stop down. Combined resolution (T = A × D) peaks partway, then falls along the diffraction limit once the aberration improvement is essentially complete.</title>
