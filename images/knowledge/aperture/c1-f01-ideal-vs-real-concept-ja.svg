<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 990" width="800" height="990" role="img" aria-labelledby="t"><title id="t">上段：絞ると収差の影響は減り、回折（小絞りボケ）の影響は増える（概念図、同じ単位の量ではない）。下段：収差のない理想レンズ（計算値、開放を100%とした相対値）は回折だけによって開放から低下し、実レンズ（概念図）では開放側の収差との競合で途中にピークが生じることがある。交点やピーク位置は特定のF値を示さない。</title>
