<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130" role="img" aria-labelledby="t"><title id="t">上段：絞ると収差の影響は減り、回折（小絞りボケ）の影響は増える（概念図、同じ単位の量ではない）。下段：回折だけなら性能は開放から低下し（計算値、相対）、収差で残る割合は絞ると上がる（概念）。総合の解像性能はその掛け算で、収差と回折が競合する領域で最大になることがある（概念）。AとBの交点は最良絞りではなく、ピーク位置は特定のF値を示さない。</title>
