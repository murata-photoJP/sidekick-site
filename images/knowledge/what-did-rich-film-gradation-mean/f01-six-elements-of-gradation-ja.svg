<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-labelledby="t"><title id="t">概念図：「階調が豊か」という一つの言葉を、六つの要素に分けて考える。記録できる範囲／明るさの写り方の曲線／細かな明暗差の分離／細かな色の差の分離／ハイライトとシャドーの見え方／出力と鑑賞。六つは同じ大きさのカードに同じ太さの矢印で並べてあり、順序・優劣・数値・割合は描いていない。粒状やノイズは、それぞれの要素の見え方に関わる。本サイトの整理であり、当時の定義ではない。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb14a"/></marker></defs>
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">概念図：「階調が豊か」を、六つに分ける</text>
<rect x="292.0" y="84.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="118.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">記録できる範囲</text>
<text x="312.0" y="150.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">どこからどこまで写るか</text>
<rect x="292.0" y="178.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="212.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">明るさの写り方の曲線</text>
<text x="312.0" y="244.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">暗い側と明るい側の変化の付き方</text>
<rect x="292.0" y="272.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="306.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">細かな明暗差の分離</text>
<text x="312.0" y="338.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">輝きから陰までの途中</text>
<rect x="292.0" y="366.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="400.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">細かな色の差の分離</text>
<text x="312.0" y="432.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">黄緑から深緑までの途中</text>
<rect x="292.0" y="460.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="494.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">ハイライトとシャドーの見え方</text>
<text x="312.0" y="526.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">どう頭打ちになり、どう沈むか</text>
<rect x="292.0" y="554.0" width="488.0" height="80.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="588.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">出力と鑑賞</text>
<text x="312.0" y="620.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">どこで、どんな光の下で見るか</text>
<rect x="16.0" y="293.0" width="200.0" height="132.0" rx="12" fill="none" stroke="#ff8a00" stroke-width="3"/>
<text x="116.0" y="351.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">「階調が</text>
<text x="116.0" y="389.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">豊か」</text>
<line x1="219.0" y1="359.0" x2="254.0" y2="359.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="254.0" y1="124.0" x2="254.0" y2="594.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="254.0" y1="124.0" x2="289.0" y2="124.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="218.0" x2="289.0" y2="218.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="312.0" x2="289.0" y2="312.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="406.0" x2="289.0" y2="406.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="500.0" x2="289.0" y2="500.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="594.0" x2="289.0" y2="594.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="780.0" y="678.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="end">粒状やノイズは、それぞれの要素の見え方に関わる</text>
<line x1="20.0" y1="726.0" x2="780.0" y2="726.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="762.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">六つは並べただけ。順序・優劣・数値ではありません</text>
<text x="20.0" y="798.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">本サイトの整理（当時の定義ではありません）</text>
</g>
</svg>
