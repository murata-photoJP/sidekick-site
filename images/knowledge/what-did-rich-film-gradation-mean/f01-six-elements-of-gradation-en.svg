<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" role="img" aria-labelledby="t"><title id="t">Conceptual diagram: the single phrase “rich gradation” split into six elements — recordable range, tone-response curve, separation of small luminance differences, separation of small color differences, highlight and shadow rendering, output and viewing. The six cards are the same size and the arrows the same weight; no order, ranking, number or proportion is drawn. Grain and noise affect how every element is seen. This site’s own framework, not a definition from the period.</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb14a"/></marker></defs>
<text x="20.0" y="40.0" fill="#8c96aa" font-size="28" font-weight="600" text-anchor="start">Concept: splitting “rich gradation” into six</text>
<rect x="292.0" y="84.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="124.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Recordable range</text>
<text x="312.0" y="160.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">how far it records, dark to bright</text>
<rect x="292.0" y="202.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="242.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Tone-response curve</text>
<text x="312.0" y="278.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">how brightness changes on each side</text>
<rect x="292.0" y="320.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="350.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Separation of small</text>
<text x="312.0" y="378.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">luminance differences</text>
<text x="312.0" y="408.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">the tones between glare and shadow</text>
<rect x="292.0" y="438.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="468.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Separation of small</text>
<text x="312.0" y="496.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">color differences</text>
<text x="312.0" y="526.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">between yellow-green and deep green</text>
<rect x="292.0" y="556.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="596.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Highlight and shadow rendering</text>
<text x="312.0" y="632.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">how they clip, how they sink</text>
<rect x="292.0" y="674.0" width="488.0" height="104.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="312.0" y="714.0" fill="#ffb14a" font-size="24" font-weight="700" text-anchor="start">Output and viewing</text>
<text x="312.0" y="750.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">where, and under what light</text>
<rect x="16.0" y="365.0" width="200.0" height="132.0" rx="12" fill="none" stroke="#ff8a00" stroke-width="3"/>
<text x="116.0" y="423.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">“Rich</text>
<text x="116.0" y="461.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">gradation”</text>
<line x1="219.0" y1="431.0" x2="254.0" y2="431.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="254.0" y1="136.0" x2="254.0" y2="726.0" stroke="#ffb14a" stroke-width="2.5"/>
<line x1="254.0" y1="136.0" x2="289.0" y2="136.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="254.0" x2="289.0" y2="254.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="372.0" x2="289.0" y2="372.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="490.0" x2="289.0" y2="490.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="608.0" x2="289.0" y2="608.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="254.0" y1="726.0" x2="289.0" y2="726.0" stroke="#ffb14a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="780.0" y="822.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="end">Grain and noise affect how every element is seen</text>
<line x1="20.0" y1="866.0" x2="780.0" y2="866.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="902.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Six items, side by side: not an order, a ranking or a number</text>
<text x="20.0" y="938.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">This site’s own framework, not a definition from the period</text>
</g>
</svg>
