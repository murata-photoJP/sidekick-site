<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1320" width="800" height="1320" role="img" aria-labelledby="t"><title id="t">Conceptual figure in two parts. Top: viewing on a monitor. At 100% view each pixel maps to one screen pixel, so the image with more pixels (High Resolution mode or Super Resolution) shows the same detail at twice the size; in fit-to-screen view both images are resampled to the same screen pixel count. Bottom: a B0 print viewed from 50 cm, 1 m and 2 m. For each distance, two horizontal bars show how fine, in the eye, the pixel grid of each route can reach: normal (about 25 megapixels) and High Resolution / Super Resolution (about 100 megapixels), on a log axis without numeric ticks. Doubling the distance moves both bars one step to the right; the two bars always differ by a factor of two. A soft-edged band in the middle marks roughly the fineness the eye can pick up; its width moves with viewer, contrast, illumination, subject and output conditions, and there is no fixed boundary. Numbers are in the notes at the end of the article. Not measurements.</title>
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb14a" stop-opacity="0"/><stop offset="0.35" stop-color="#ffb14a" stop-opacity="0.22"/><stop offset="0.65" stop-color="#ffb14a" stop-opacity="0.22"/><stop offset="1" stop-color="#ffb14a" stop-opacity="0"/></linearGradient>
</defs>
