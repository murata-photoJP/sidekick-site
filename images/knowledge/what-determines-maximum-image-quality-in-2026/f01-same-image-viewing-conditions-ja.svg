<text x="200.0" y="292.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">ハイレゾ／SR</text>
<text x="270.0" y="142.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="start">100% 表示</text>
<text x="270.0" y="180.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">画素を画面の点に一対一で対応させる。</text>
<text x="270.0" y="216.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">画素数が多い方は、</text>
<text x="270.0" y="252.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">同じ細部を 2 倍の大きさで見ている。</text>
