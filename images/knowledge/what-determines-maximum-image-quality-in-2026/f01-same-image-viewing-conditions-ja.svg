<line x1="186.0" y1="320.0" x2="186.0" y2="374.0" stroke="#ff8a00" stroke-width="2.0" stroke-linecap="round"/>
<text x="270.0" y="342.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="start">画面に合わせた表示</text>
<text x="270.0" y="380.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">どちらも同じ画面の画素数に縮小される。</text>
<text x="270.0" y="416.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">格子の差の上限は、</text>
<text x="270.0" y="452.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">画面の画素数になる。</text>
<text x="20.0" y="490.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">枠の中の縞は「同じ細部」の見え方の模式。測定値ではない。</text>
<line x1="20.0" y1="512.0" x2="780.0" y2="512.0" stroke="#2b3140" stroke-width="1.2" stroke-linecap="round"/>
