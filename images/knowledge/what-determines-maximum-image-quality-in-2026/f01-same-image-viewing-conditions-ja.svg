<text x="84.0" y="1110.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">ノーマル（約 2,500 万画素）の格子が届く細かさ</text>
<rect x="20.0" y="1130.0" width="50.0" height="22.0" rx="4" fill="#ff8a00" stroke="none" stroke-width="0"/>
<text x="84.0" y="1148.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">ハイレゾ／スーパー解像度（約 1 億画素）の格子が届く細かさ</text>
<text x="20.0" y="1196.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">帯の幅は、人・コントラスト・照明・被写体・出力条件で動く。</text>
<text x="20.0" y="1232.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">決まった境目はない。</text>
<text x="20.0" y="1268.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">距離が 2 倍で両方の棒が同じだけ右へ。二本の差は、いつも 2 倍。</text>
<text x="20.0" y="1064.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">横軸：目に届く細かさ（右へ 1 目盛 ＝ 2 倍。数値は本文の補足）</text>
<line x1="20.0" y1="1280.0" x2="780.0" y2="1280.0" stroke="#2b3140" stroke-width="1.2" stroke-linecap="round"/>
<text x="20.0" y="1310.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">概念図。数値・測定値・製品の優劣なし。本サイトの整理。</text>
