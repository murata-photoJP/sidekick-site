<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1320" width="800" height="1320" role="img" aria-labelledby="t"><title id="t">概念図。二段構成。上段はモニターで見る場合。100% 表示では画素を画面の点に一対一で対応させるので、画素数の多い画像（ハイレゾやスーパー解像度）は同じ細部を二倍の大きさで見ていることになる。画面に合わせた表示では、どちらの画像も同じ画面の画素数に縮小される。下段は B0 プリントを 50 cm、1 m、2 m から見る場合。各距離に、ノーマル（約 2,500 万画素）とハイレゾ／スーパー解像度（約 1 億画素）の二本の横棒で、画素の格子が目の中でどこまで細かく届くかを、目盛りのない対数軸に示す。距離を二倍にすると両方の棒が同じだけ右へ動き、二本の差は常に二倍のまま。横軸の中ほどに、目が拾える細かさの目安を、端のぼやけた帯で示す。帯の幅は人・コントラスト・照明・被写体・出力条件で動き、決まった境目はない。数値は本文の補足にある。測定値ではない。</title>
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb14a" stop-opacity="0"/><stop offset="0.35" stop-color="#ffb14a" stop-opacity="0.22"/><stop offset="0.65" stop-color="#ffb14a" stop-opacity="0.22"/><stop offset="1" stop-color="#ffb14a" stop-opacity="0"/></linearGradient>
</defs>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="42.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">同じ一枚が、見る条件でどこまで細かく目に届くか</text>
<text x="20.0" y="92.0" fill="#eef1f8" font-size="28" font-weight="600" text-anchor="start">モニターで見る</text>
