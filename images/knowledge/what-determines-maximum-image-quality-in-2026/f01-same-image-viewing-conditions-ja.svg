<text x="40.0" y="988.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">粗い</text>
<text x="760.0" y="988.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="end">細かい</text>
