<text x="20.0" y="720.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="start">1 m</text>
<rect x="40.0" y="734.0" width="280.0" height="22.0" rx="4" fill="#eef1f8" stroke="none" stroke-width="0"/>
