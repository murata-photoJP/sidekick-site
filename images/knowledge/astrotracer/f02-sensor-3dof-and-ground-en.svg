<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t"><title id="t">The sensor moves in X, Y and rotation under a ground image that stays still.</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c96aa"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb14a"/></marker>
</defs>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<path d="M 104.0 142.0 Q 132.8 190.0 104.0 238.0 Q 75.2 190.0 104.0 142.0 Z" fill="none" stroke="#ffb14a" stroke-width="2.8"/>
<text x="104.0" y="268.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="middle">Lens (fixed)</text>
<rect x="196.0" y="96.0" width="290.0" height="200.0" rx="8" fill="#14161d" stroke="#515969" stroke-width="2.0"/>
<path d="M 210 268 L 268 176 L 310 224 L 352 158 L 420 268 Z" fill="#515969" opacity="0.75"/>
<text x="341.0" y="76.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="middle">Ground image (stationary)</text>
<rect x="253.0" y="138.0" width="176.0" height="116.0" rx="5" fill="#14161d" stroke="#eef1f8" stroke-width="2.4"/>
<line x1="235.0" y1="196.0" x2="447.0" y2="196.0" stroke="#ffb14a" stroke-width="3.0" stroke-linecap="round" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
<line x1="341.0" y1="114.0" x2="341.0" y2="278.0" stroke="#ffb14a" stroke-width="3.0" stroke-linecap="round" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
<path d="M 452.5 245.6 A 122.0 122.0 0 0 1 370.5 314.4" fill="none" stroke="#ffb14a" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ah2)"/>
<text x="255.0" y="330.0" fill="#eef1f8" font-size="26" font-weight="700" text-anchor="start">Image sensor</text>
<text x="506.0" y="152.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">X / Y shift</text>
<text x="506.0" y="198.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">+ rotation (optical axis)</text>
<rect x="26.0" y="400.0" width="748.0" height="84.0" rx="10" fill="#14161d" stroke="#2b3140" stroke-width="1.8"/>
<text x="400.0" y="436.0" fill="#eef1f8" font-size="27" font-weight="700" text-anchor="middle">The ground image is not moving. The sensor is.</text>
<text x="400.0" y="470.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="middle">So from the sensor, the ground drifts the other way</text>
</g></svg>
