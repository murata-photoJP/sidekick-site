<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="t"><title id="t">T1 to T4 are parallel constraints; the photographer chooses T5.</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c96aa"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffb14a"/></marker>
</defs>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<rect x="60.0" y="96.0" width="328.0" height="104.0" rx="10" fill="#14161d" stroke="#2b3140" stroke-width="2.0"/>
<text x="84.0" y="142.0" fill="#ffb14a" font-size="30" font-weight="700" text-anchor="start">T1</text>
<text x="152.0" y="142.0" fill="#eef1f8" font-size="27" font-weight="600" text-anchor="start">機械の限界</text>
<text x="84.0" y="178.0" fill="#8c96aa" font-size="24" font-weight="600" text-anchor="start">計算できる</text>
<rect x="412.0" y="96.0" width="328.0" height="104.0" rx="10" fill="#14161d" stroke="#2b3140" stroke-width="2.0"/>
<text x="436.0" y="142.0" fill="#ffb14a" font-size="30" font-weight="700" text-anchor="start">T2</text>
<text x="504.0" y="142.0" fill="#eef1f8" font-size="27" font-weight="600" text-anchor="start">追尾の精度</text>
<text x="436.0" y="178.0" fill="#8c96aa" font-size="24" font-weight="600" text-anchor="start">計算できる</text>
<rect x="60.0" y="226.0" width="328.0" height="104.0" rx="10" fill="#14161d" stroke="#2b3140" stroke-width="2.0"/>
<text x="84.0" y="272.0" fill="#ffb14a" font-size="30" font-weight="700" text-anchor="start">T3</text>
<text x="152.0" y="272.0" fill="#eef1f8" font-size="27" font-weight="600" text-anchor="start">地上のブレ</text>
<text x="84.0" y="308.0" fill="#8c96aa" font-size="24" font-weight="600" text-anchor="start">計算できる</text>
<rect x="412.0" y="226.0" width="328.0" height="104.0" rx="10" fill="#14161d" stroke="#2b3140" stroke-width="2.0"/>
<text x="436.0" y="272.0" fill="#ffb14a" font-size="30" font-weight="700" text-anchor="start">T4</text>
<text x="504.0" y="272.0" fill="#eef1f8" font-size="27" font-weight="600" text-anchor="start">周辺の星</text>
<text x="436.0" y="308.0" fill="#8c96aa" font-size="24" font-weight="600" text-anchor="start">計算できる</text>
<text x="400.0" y="62.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="middle">T1〜T4 は並列。どれが先に効くかは条件しだい</text>
<text x="72.0" y="372.0" fill="#8c96aa" font-size="25" font-weight="600" text-anchor="start">メーカーの「追尾可能時間」は T1</text>
<line x1="224.0" y1="330.0" x2="224.0" y2="404.0" stroke="#ffb14a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah2)"/>
<line x1="576.0" y1="330.0" x2="576.0" y2="404.0" stroke="#ffb14a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah2)"/>
<rect x="60.0" y="420.0" width="680.0" height="118.0" rx="12" fill="#14161d" stroke="#ff8a00" stroke-width="2.6"/>
<text x="92.0" y="470.0" fill="#ff8a00" font-size="32" font-weight="700" text-anchor="start">T5</text>
<text x="160.0" y="470.0" fill="#eef1f8" font-size="29" font-weight="700" text-anchor="start">実際に何秒で撮るか</text>
<text x="92.0" y="508.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">決めるのは撮影者</text>
<text x="400.0" y="580.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="middle">何px動くかは計算できる。何pxまで許すかは撮影者が決める</text>
</g></svg>
