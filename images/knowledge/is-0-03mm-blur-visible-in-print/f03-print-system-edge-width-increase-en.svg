<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" width="800" height="956" role="img" aria-labelledby="t"><title id="t">Model-calculation diagram: how much the print system widens the edge of the enlarged 0.03 mm blur, as horizontal range bands. Four rows, 5×, A4, A3 and 20×, each with two bands. The filled band assumes the shape from the 1999 measurement (dye printer, peer-reviewed): plus 23 to 38 percent, 9 to 15, 4 to 8, 1 to 2 percent. The dashed band fits the single 2019 example (Epson P800, pigment; one printer, one paper, one print) to the same shape: plus 49 to 85, 19 to 36, 10 to 19, 3 to 6 percent. An increase in width, not in how visible the blur is. Neither is a typical value for today’s printers, and the figure is not a ranking of old against new.</title>
