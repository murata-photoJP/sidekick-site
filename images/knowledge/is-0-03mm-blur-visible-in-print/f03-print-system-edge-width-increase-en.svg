<text x="96.0" y="259.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">one printer, one paper, one print)</text>
<text x="96.0" y="289.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">fitted to the same shape</text>
