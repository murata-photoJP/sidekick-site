<text x="20.0" y="40.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="start">How much the print system widens the blur’s edge</text>
<text x="20.0" y="74.0" fill="#ffb14a" font-size="24" font-weight="600" text-anchor="start">Model calculation — width increase (%), not visibility</text>
<line x1="20.0" y1="114.0" x2="80.0" y2="114.0" stroke="#ff8a00" stroke-width="16" stroke-linecap="butt"/>
