<text x="96.0" y="153.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">(dye printer, peer-reviewed;</text>
<text x="96.0" y="183.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">print-system blur width about 0.08–0.1 mm)</text>
