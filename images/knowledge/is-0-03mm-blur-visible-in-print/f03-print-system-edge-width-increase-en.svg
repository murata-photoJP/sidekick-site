<line x1="170.0" y1="652.0" x2="690.0" y2="652.0" stroke="#2b3140" stroke-width="1.0"/>
<text x="156.0" y="713.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="end">20×</text>
<line x1="175.2" y1="682.0" x2="180.4" y2="682.0" stroke="#ff8a00" stroke-width="16" stroke-linecap="butt"/>
<text x="192.4" y="691.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">+1–2%</text>
<rect x="185.6" y="718.0" width="15.6" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="213.2" y="735.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="start">+3–6%</text>
<line x1="20.0" y1="862.0" x2="780.0" y2="862.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="898.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Not typical values for today’s printers; not old vs new</text>
<text x="20.0" y="932.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">10–90% edge width; driver processing not included</text>
