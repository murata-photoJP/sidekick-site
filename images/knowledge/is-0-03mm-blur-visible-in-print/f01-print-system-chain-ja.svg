<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1156" width="800" height="1156" role="img" aria-labelledby="t"><title id="t">概念図：センサー面のぼけがプリントになるまでの段。上から、センサー面のぼけ 0.03 mm、拡大（幾何で決まる）、続いてプリント系の箱の中に、並べ直し（画像データの解像度 ppi）、色変換とハーフトーン、ドット配置（公称 dpi はここ）、インクの広がりと紙の中の光の散乱。同じ箱の中に、区切り線と「または（インクジェットではない場合。上の4段の代わり）」の見出しを挟んで、別の方式として銀塩のデジタル露光（露光、現像、印画紙。インクは使わない）。最後に完成プリント。各箱の注：拡大は計算で決まる、プリント系の分は組み合わせで決まり測らないと分からない。各段の大きさ、どの段が支配的か、方式の優劣は描いていない。dpi と ppi は別の段の数字。本サイトのまとめ方。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c96aa"/></marker></defs>
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">概念図：0.03 mmのぼけが、プリントになるまでの段</text>
<rect x="20.0" y="70.0" width="760.0" height="60.0" rx="12" fill="none" stroke="#ff8a00" stroke-width="2"/>
<text x="400.0" y="109.0" fill="#ff8a00" font-size="26" font-weight="600" text-anchor="middle">センサー面のぼけ 0.03 mm</text>
<line x1="400.0" y1="130.0" x2="400.0" y2="156.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="158.0" width="760.0" height="92.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="196.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">拡大（×倍率）―― 計算で決まる（幾何）</text>
<text x="400.0" y="230.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">5倍なら0.15 mm、20倍なら0.6 mm</text>
<line x1="400.0" y1="250.0" x2="400.0" y2="276.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="278.0" width="760.0" height="664.0" rx="14" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="10 7"/>
<text x="36.0" y="314.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">プリント系（この記事のまとめ方）―― 工程が足す分</text>
<text x="36.0" y="348.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="start">組み合わせで決まり、測らないと分からない</text>
<text x="36.0" y="384.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">インクジェットの場合</text>
<rect x="36.0" y="402.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="441.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="middle">並べ直し（画像データの解像度 ppi）</text>
<line x1="400.0" y1="462.0" x2="400.0" y2="482.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="484.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="523.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="middle">色変換・ハーフトーン（濃淡をドットの疎密へ）</text>
<line x1="400.0" y1="544.0" x2="400.0" y2="564.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="566.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="605.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="middle">ドット配置（公称 dpi はここ）</text>
<line x1="400.0" y1="626.0" x2="400.0" y2="646.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="648.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="687.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="middle">インクの広がり・紙の中の光の散乱</text>
<line x1="36.0" y1="722.0" x2="764.0" y2="722.0" stroke="#ffb14a" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="36.0" y="758.0" fill="#ffb14a" font-size="26" font-weight="600" text-anchor="start">または（インクジェットではない場合。上の4段の代わり）</text>
<rect x="36.0" y="770.0" width="728.0" height="84.0" rx="12" fill="none" stroke="#2b3140" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="400.0" y="802.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">別の方式：銀塩のデジタル露光（インクは使わない）</text>
<text x="400.0" y="834.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">露光（レーザー／LED）→ 現像 → 印画紙</text>
<text x="36.0" y="896.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">段ごとの大きさは示さない。方式によって、段の中身も違う</text>
<line x1="400.0" y1="942.0" x2="400.0" y2="968.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="970.0" width="760.0" height="60.0" rx="12" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="400.0" y="1009.0" fill="#ffb14a" font-size="26" font-weight="600" text-anchor="middle">完成プリント</text>
<line x1="20.0" y1="1064.0" x2="780.0" y2="1064.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="1100.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">dpi（ドットを置く間隔）と ppi（画像の画素密度）は、別の段</text>
<text x="20.0" y="1136.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">どの段が大きいか、方式の優劣は、この図では示していない</text>
</g>
</svg>
