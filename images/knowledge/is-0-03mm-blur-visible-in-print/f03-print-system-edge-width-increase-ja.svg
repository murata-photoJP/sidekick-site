<line x1="274.0" y1="288.0" x2="274.0" y2="722.0" stroke="#2b3140" stroke-width="1.2" stroke-dasharray="3 6"/>
<line x1="274.0" y1="722.0" x2="274.0" y2="730.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="274.0" y="762.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">20</text>
<line x1="378.0" y1="288.0" x2="378.0" y2="722.0" stroke="#2b3140" stroke-width="1.2" stroke-dasharray="3 6"/>
