<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 916" width="800" height="916" role="img" aria-labelledby="t"><title id="t">モデル計算の図：プリント系は、伸ばした 0.03 mm のぼけの境目の幅を、どれだけ広げるか。横向きの範囲の帯。5倍、A4、A3、20倍の四行に、それぞれ二つの帯。塗りの帯は、1999 年の測定（染料プリンタ、査読論文）の形を仮定した場合で、プラス 23 から 38 パーセント、9 から 15、4 から 8、1 から 2 パーセント。破線の帯は、2019 年の一例（Epson P800、顔料、一台・一紙・一枚）を同じ形に当てた場合で、プラス 49 から 85、19 から 36、10 から 19、3 から 6 パーセント。幅の増分であり、見え方ではない。どちらも、いまのプリンタの一般値ではなく、新旧の優劣を示す図でもない。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">プリント系が広げる、ぼけの境目の幅（モデル計算）</text>
<text x="20.0" y="84.0" fill="#ffb14a" font-size="26" font-weight="600" text-anchor="start">幅の増分（%）であり、見え方ではない</text>
<line x1="20.0" y1="126.0" x2="80.0" y2="126.0" stroke="#ff8a00" stroke-width="16" stroke-linecap="butt"/>
<text x="96.0" y="135.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">1999年の測定（染料機、査読論文）の形を仮定</text>
<text x="96.0" y="169.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">（プリント系のぼけの幅 約0.08〜0.1 mm）</text>
<rect x="20.0" y="206.0" width="60.0" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="96.0" y="223.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">2019年の一例（P800、顔料、一台・一紙・一枚）を</text>
<text x="96.0" y="257.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">同じ形に当てた場合</text>
