<text x="223.6" y="547.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+4〜8 %</text>
<rect x="222.0" y="574.0" width="46.8" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="280.8" y="591.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+10〜19 %</text>
<line x1="170.0" y1="612.0" x2="690.0" y2="612.0" stroke="#2b3140" stroke-width="1.0"/>
<text x="156.0" y="673.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="end">20倍</text>
<line x1="175.2" y1="642.0" x2="180.4" y2="642.0" stroke="#ff8a00" stroke-width="16" stroke-linecap="butt"/>
<text x="192.4" y="651.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+1〜2 %</text>
<rect x="185.6" y="678.0" width="15.6" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="213.2" y="695.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+3〜6 %</text>
<line x1="20.0" y1="822.0" x2="780.0" y2="822.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="858.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">どちらも今のプリンタの一般値ではなく、新旧の優劣でもない</text>
<text x="20.0" y="894.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">本サイトのモデル計算（10–90%幅。ドライバ処理は含まない）</text>
</g>
</svg>
