<text x="482.0" y="762.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">60</text>
<line x1="586.0" y1="288.0" x2="586.0" y2="722.0" stroke="#2b3140" stroke-width="1.2" stroke-dasharray="3 6"/>
<line x1="586.0" y1="722.0" x2="586.0" y2="730.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="586.0" y="762.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">80</text>
<line x1="690.0" y1="288.0" x2="690.0" y2="722.0" stroke="#2b3140" stroke-width="1.2" stroke-dasharray="3 6"/>
<line x1="690.0" y1="722.0" x2="690.0" y2="730.0" stroke="#2b3140" stroke-width="1.5"/>
<text x="690.0" y="762.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">100</text>
