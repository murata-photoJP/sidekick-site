<text x="690.0" y="798.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="end">ぼけの境目の幅の増分（%）</text>
<text x="156.0" y="361.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="end">5倍</text>
