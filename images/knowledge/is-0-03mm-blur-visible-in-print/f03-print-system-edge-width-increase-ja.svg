<text x="379.6" y="339.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+23〜38 %</text>
<rect x="424.8" y="366.0" width="187.2" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="624.0" y="383.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+49〜85 %</text>
<line x1="170.0" y1="404.0" x2="690.0" y2="404.0" stroke="#2b3140" stroke-width="1.0"/>
<text x="156.0" y="465.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="end">A4</text>
<line x1="216.8" y1="434.0" x2="248.0" y2="434.0" stroke="#ff8a00" stroke-width="16" stroke-linecap="butt"/>
<text x="260.0" y="443.0" fill="#eef1f8" font-size="26" font-weight="500" text-anchor="start">+9〜15 %</text>
<rect x="268.8" y="470.0" width="88.4" height="16.0" rx="0" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="7 5"/>
