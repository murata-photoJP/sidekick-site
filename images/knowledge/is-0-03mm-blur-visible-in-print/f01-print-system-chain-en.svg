<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1302" width="800" height="1302" role="img" aria-labelledby="t"><title id="t">Concept diagram: the stages a blur on the sensor plane passes through on its way to a print. From the top: blur on the sensor plane, 0.03 mm; enlargement (decided by geometry); then, inside the print-system box, for inkjet: resampling (image data, ppi), color conversion and halftoning, dot placement (where the nominal dpi lives), ink spread and light scattering in the paper. In the same box, after a separator and the heading “Or, if not inkjet — in place of the four stages above”, an alternative route: silver-halide digital exposure (exposure, development, photographic paper; no ink). Finally, the finished print. Notes in the boxes: enlargement is decided by calculation; what the print system adds is decided by the combination and unknown until measured. Stage sizes, which stage dominates, and which method is better are not drawn. dpi and ppi belong to different stages. This site’s own grouping.</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c96aa"/></marker></defs>
<text x="20.0" y="40.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="start">Concept: the stages a 0.03 mm blur passes through</text>
<text x="20.0" y="74.0" fill="#8c96aa" font-size="26" font-weight="600" text-anchor="start">on its way to a finished print</text>
<rect x="20.0" y="104.0" width="760.0" height="60.0" rx="12" fill="none" stroke="#ff8a00" stroke-width="2"/>
<text x="400.0" y="143.0" fill="#ff8a00" font-size="26" font-weight="600" text-anchor="middle">Blur on the sensor plane: 0.03 mm</text>
<line x1="400.0" y1="164.0" x2="400.0" y2="190.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="192.0" width="760.0" height="92.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="230.0" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">Enlargement (× magnification) — decided by calculation</text>
<text x="400.0" y="264.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="middle">0.15 mm at 5×, 0.6 mm at 20×</text>
<line x1="400.0" y1="284.0" x2="400.0" y2="310.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="312.0" width="760.0" height="696.0" rx="14" fill="none" stroke="#ffb14a" stroke-width="2" stroke-dasharray="10 7"/>
<text x="36.0" y="348.0" fill="#ffb14a" font-size="26" font-weight="700" text-anchor="start">The print system (as this article groups it)</text>
<text x="36.0" y="382.0" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="start">What the process adds — decided by the combination,</text>
<text x="36.0" y="414.0" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="start">unknown until measured</text>
<text x="36.0" y="450.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">For inkjet</text>
<rect x="36.0" y="468.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="506.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="middle">Resampling (image data, ppi)</text>
<line x1="400.0" y1="528.0" x2="400.0" y2="548.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="550.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="588.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="middle">Color conversion and halftoning (tones → dot density)</text>
<line x1="400.0" y1="610.0" x2="400.0" y2="630.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="632.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="670.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="middle">Dot placement (the nominal dpi lives here)</text>
<line x1="400.0" y1="692.0" x2="400.0" y2="712.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="36.0" y="714.0" width="728.0" height="60.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="400.0" y="752.0" fill="#eef1f8" font-size="24" font-weight="500" text-anchor="middle">Ink spread and light scattering in the paper</text>
<line x1="36.0" y1="788.0" x2="764.0" y2="788.0" stroke="#ffb14a" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="36.0" y="824.0" fill="#ffb14a" font-size="24" font-weight="600" text-anchor="start">Or, if not inkjet — in place of the four stages above</text>
<rect x="36.0" y="836.0" width="728.0" height="84.0" rx="12" fill="none" stroke="#2b3140" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="400.0" y="868.0" fill="#eef1f8" font-size="24" font-weight="600" text-anchor="middle">Alternative: silver-halide digital exposure (no ink)</text>
<text x="400.0" y="900.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="middle">Laser/LED exposure → development → photographic paper</text>
<text x="36.0" y="962.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Stage sizes are not shown; the stages differ by method</text>
<line x1="400.0" y1="1008.0" x2="400.0" y2="1034.0" stroke="#8c96aa" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20.0" y="1036.0" width="760.0" height="60.0" rx="12" fill="none" stroke="#ffb14a" stroke-width="2"/>
<text x="400.0" y="1075.0" fill="#ffb14a" font-size="26" font-weight="600" text-anchor="middle">Finished print</text>
<line x1="20.0" y1="1130.0" x2="780.0" y2="1130.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="1164.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">dpi (dot spacing) and ppi (image pixel density)</text>
<text x="20.0" y="1196.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">belong to different stages</text>
<text x="20.0" y="1228.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">Which stage is largest, and which method is better,</text>
<text x="20.0" y="1260.0" fill="#8c96aa" font-size="24" font-weight="500" text-anchor="start">are not shown</text>
</g>
</svg>
