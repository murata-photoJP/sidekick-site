<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850" role="img" aria-labelledby="t"><title id="t">概念図：上段は市場（資料）。富士、コダック、アグファ、その他のリバーサルフィルムが並んで存在し、用途によって選ばれるフィルムは違った。下段は私の現場（山岳写真の同人）。私と周りの同人の仲間では Velvia がほぼ一択で、速いシャッターが必要なときだけ別のフィルムを使った。上段と下段は同じ大きさの話ではなく、どちらかが正しいのでもない。数量・順位・シェアは描いていない。本サイトの整理。</title>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif">
<text x="20.0" y="40.0" fill="#8c96aa" font-size="30" font-weight="600" text-anchor="start">概念図：市場には複数、私の現場ではほぼ一つ</text>
<rect x="20.0" y="64.0" width="760.0" height="300.0" rx="14" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="40.0" y="106.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">市場（資料）</text>
<text x="40.0" y="142.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">複数のフィルムが、並んで存在していた</text>
<rect x="40.0" y="168.0" width="171.0" height="90.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="125.5" y="223.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="middle">富士</text>
<rect x="223.0" y="168.0" width="171.0" height="90.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="308.5" y="223.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="middle">コダック</text>
<rect x="406.0" y="168.0" width="171.0" height="90.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="491.5" y="223.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="middle">アグファ</text>
<rect x="589.0" y="168.0" width="171.0" height="90.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="674.5" y="223.0" fill="#eef1f8" font-size="28" font-weight="700" text-anchor="middle">その他</text>
<text x="40.0" y="336.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">用途によって、選ばれるフィルムは違った</text>
<line x1="20.0" y1="397.0" x2="250.0" y2="397.0" stroke="#2b3140" stroke-width="1.2"/>
<line x1="550.0" y1="397.0" x2="780.0" y2="397.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="400.0" y="406.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">同じ大きさの話ではない</text>
<rect x="20.0" y="430.0" width="760.0" height="300.0" rx="14" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="40.0" y="472.0" fill="#ffb14a" font-size="28" font-weight="700" text-anchor="start">私の現場（山岳写真の同人）</text>
<text x="40.0" y="508.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">私と、周りの同人の仲間の話</text>
<rect x="40.0" y="534.0" width="330.0" height="110.0" rx="12" fill="none" stroke="#ff8a00" stroke-width="2"/>
<text x="205.0" y="582.0" fill="#ff8a00" font-size="30" font-weight="700" text-anchor="middle">Velvia</text>
<text x="205.0" y="620.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">ほぼ一択</text>
<rect x="386.0" y="534.0" width="374.0" height="110.0" rx="12" fill="none" stroke="#2b3140" stroke-width="2"/>
<text x="573.0" y="572.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">速いシャッターが</text>
<text x="573.0" y="604.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="middle">必要なときだけ</text>
<text x="573.0" y="636.0" fill="#eef1f8" font-size="26" font-weight="600" text-anchor="middle">別のフィルム</text>
<text x="40.0" y="702.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">市場の話ではなく、私の経験の話</text>
<line x1="20.0" y1="754.0" x2="780.0" y2="754.0" stroke="#2b3140" stroke-width="1.2"/>
<text x="20.0" y="790.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">市場の数量・順位・シェアを示す図ではありません</text>
<text x="20.0" y="826.0" fill="#8c96aa" font-size="26" font-weight="500" text-anchor="start">本サイトの整理（上段は資料、下段は私の経験）</text>
</g>
</svg>
